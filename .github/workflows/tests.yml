name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # 只装必需依赖。语义嵌入是可选的，CI 不装 onnxruntime——
      # 顺便验证「默认零重依赖 + 语义缺失能降级」这条承诺在干净环境成立。
      - run: pip install numpy jieba
      - name: 单元测试
        run: python -m unittest tests -v
      - name: 端到端 demo（内置样例，验证开箱即跑）
        run: python demo.py
      - name: 可观测性面板
        run: python dashboard_demo.py
      - name: 冲突消解演示
        run: python conflict_demo.py
